<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9633315289535323"
     crossorigin="anonymous"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <script src="{{ url_for('static', filename='js/neuraltrend-csrf.js') }}"></script>

    <meta name="google-site-verification" content="X_r0ZvDpeEf_-sfl-uJMD69VuvF4d0Llip3eKnQjQtI" />
    
    <title>{% block title %}NeuralTrend | AI Trading Signals, Backtests & Paper Simulations{% endblock %}</title>
    
    <meta 
        name="description" 
        content="{% block meta_description %}NeuralTrend provides AI-powered market signals, historical backtests, equity previews, and live paper simulations for crypto and traditional assets.{% endblock %}"
    >
    
    <link rel="canonical" href="{{ request.url_root.rstrip('/') ~ request.path }}">
    
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NeuralTrend">
    <meta property="og:title" content="NeuralTrend | AI Trading Signals">
    <meta property="og:description" content="AI-powered market signals, backtests, equity previews, and live paper simulations for crypto and traditional assets.">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:image" content="{{ url_for('static', filename='logo.png', _external=True) }}">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NeuralTrend | AI Trading Signals">
    <meta name="twitter:description" content="AI-powered market signals, backtests, equity previews, and live paper simulations.">
    <meta name="twitter:image" content="{{ url_for('static', filename='logo.png', _external=True) }}">
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Plotly CDN (include once per page, ideally in <head>) -->
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/neuraltrend.css') }}">
    {% block page_styles %}{% endblock %}

</head>
<body>

    <!-- Navigation bar -->
    <div class="navbar">
        <div class="logo">
            <a href="https://neuraltrend.org">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="My Logo">
            </a>
        </div>
    
        <!-- LEFT: nav links -->
        <div class="nav-links">
            <a href="https://neuraltrend.org">Home</a>
            <a href="{{ url_for('index') }}#products">Products</a>
            <a href="{{ url_for('subscription') }}">Subscription Plan</a>
            <a href="https://github.com/neuraltrend/" target="_blank" rel="noopener noreferrer">
                For Developers
            </a>
            <a href="{{ url_for('index') }}#contact">Contact</a>
            <a href="{{ url_for('index') }}#resources">Resources</a>
            <!-- <a href="/market">Market Insight</a> -->
            <!-- <a href="/knowledge">Knowledge Hub</a> -->
        </div>
    
        <!-- RIGHT: login area -->
        <div class="auth-area">
            <span id="user-area">
                <a href="#" id="login-btn">Login</a>
            </span>
        </div>
    </div>

    <!-- ✅ PAGE CONTENT -->
    {% block content %}{% endblock %}

    {% block page_scripts %}{% endblock %}

    <!-- Footer -->
    <footer class="nt-sticky-legal-footer">
        <div class="nt-sticky-legal-footer-inner">
            <a href="{{ url_for('terms') }}">Terms</a>
            <a href="{{ url_for('privacy') }}">Privacy</a>
            <a href="{{ url_for('risk_disclaimer') }}">Risk Disclaimer</a>
            <a href="{{ url_for('refund_policy') }}">Refund &amp; Cancellation</a>
        </div>
    </footer>

    <!-- ✅ LOGIN MODAL -->    
    <div id="loginModal" class="modal">
      <div class="modal-content">
    
        <span class="close-btn">&times;</span>
    
        <h3>Login / Signup</h3>

        <input type="email" id="emailInput" placeholder="Email">
        <input type="password" id="passwordInput" placeholder="Password">       
        
        <button id="signupBtn">Sign up</button>
        <button id="signinBtn">Login</button>

        <a href="#" id="forgot-password" style="display:block; margin:10px 0; font-size: 13px;">
            Forgot password?
        </a>  

        <a href="#" id="resend-verification" style="display:block; margin:8px 0; font-size: 13px;">
            Resend verification email
        </a>
    
        <p id="authMessage"></p>
    
      </div>
    </div>
    
    <!-- 100% privacy-first analytics -->
    <script src="{{ url_for('static', filename='js/neuraltrend-analytics.js') }}"></script>
    
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    
    <script
        async
        data-collect="outbound,emails,downloads"
        data-extensions="pdf,csv,docx,xlsx,zip,doc,xls"
        data-use-title="true"
        data-full-urls="false"
        src="https://scripts.simpleanalyticscdn.com/auto-events.js">
    </script>
    
    <script src="{{ url_for('static', filename='js/neuraltrend-site-shell.js') }}"></script>

</body>
</html>
