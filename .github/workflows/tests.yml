name: NeuralTrend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # .python-version is the file Render itself reads to pick the
          # production interpreter (runtime.txt is a Heroku convention and
          # Render does not read it - see docs/LAUNCH_READINESS_PASS2.md).
          # Pointing CI at the same file means there is exactly one place
          # to change the Python version, and CI can no longer silently
          # drift from what production actually runs.
          python-version-file: '.python-version'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify repository layout
        run: |
          test -f app.py
          test -f tests/conftest.py

      - name: Compile Python
        run: |
          python -m compileall -q app.py models.py extensions.py tools tests

      - name: Run test suite
        run: |
          python -m pytest --cov=app --cov=models --cov=operational_logging --cov=tools --cov-report=term-missing
